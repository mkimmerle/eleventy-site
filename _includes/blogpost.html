<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, shrink-to-fit=no">
	<meta name="text-scale" content="scale">
	<meta name="description" content="{{ meta-description }}">
    <meta name="theme-color" content="#335fac">
    <link rel="preload" href="/css/kadwa-v12-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/css/merriweather-sans-v27-latin-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/css/public-sans.woff2" as="font" type="font/woff2" crossorigin="anonymous">
	<link rel="stylesheet" media="screen" href="/css/main.min.042226.css">
	<link rel="stylesheet" media="print" href="/css/print.css">
    <link rel="icon" sizes="192x192" href="/art/touch-icon-highres.png">
    <link rel="apple-touch-icon" href="/art/touch-icon-iphone.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/art/touch-icon-ipad.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/art/touch-icon-iphone-retina.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/art/touch-icon-ipad-retina.png">
	<link rel="manifest" href="/manifest.json">
	{% if page.url %}
	 <link rel="canonical" href="https://markkimmerle.com{{ page.url | url }}">
	{% endif %}
	<title>{{ title }}</title>
	<style>
		blockquote {
			margin:  3rem auto;
			padding: 1.5rem;
			background-color: #e0e0e0;
			font-size: 1.5rem;
			font-style: italic;
		}
		blockquote p:last-child {
			margin-bottom: 0;
		}
		pre {
			margin: 1rem 0;
			padding: 2rem;
			background-color: #efefef;
			border-left: 2px solid #ccc;
			border-top: 2px solid #ccc;
			word-break: break-word;
			overflow-wrap: break-word;
			font-size: .9rem;
		}
		code {
			display: inline-block;
			margin: 0;
			padding: 0 0.5rem;
			background-color: #efefef;
		}
		hr {
			margin-bottom: 2rem;
		}
	</style>
</head>
<body>

	{% include 'header.html' %}

	<main class="main" id="main-content" tabindex="-1">
		{{ content }}

		<script src="https://utteranc.es/client.js"
		        repo="mkimmerle/eleventy-site"
		        issue-term="pathname"
		        theme="github-light"
		        crossorigin="anonymous"
		        async>
		</script>
	</main>

	{% include 'footer.html' %}

	<script async src="https://www.googletagmanager.com/gtag/js?id=G-GNJZCBHEMV"></script>
	<script>
		// Set Copyright Date
		var date = new Date().getFullYear();
		document.getElementById("copyrightYear").innerHTML = date;
	    // Toggle Nav
	    var navBtn = document.getElementsByClassName('btn-nav')[0];
	    
	    navBtn.addEventListener('click', function() {
	        var body = document.getElementsByTagName('body')[0];
	        body.classList.toggle('open');
	        var isOpen = body.classList.contains('open');
	        navBtn.setAttribute('aria-expanded', isOpen);
	    });
	    // Google Analytics
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-GNJZCBHEMV');
		//Service Worker
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/service-worker.js');
		}
	</script>
